name: Test CI
on:
  push:

  pull_request:
    branches:
      - master
      - main
      - next
      - next-major
      - alpha
      - beta

  schedule:
    - cron: 0 2 * * 0

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Read-only on purpose: `npm ci` runs install scripts from the dependency tree.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        os: [ubuntu-latest, windows-latest, macOS-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:style
      - run: npm test
      - run: npm run package

  # Split out of `test` so the write token never reaches the steps that run
  # repository code, and so the dry-run executes once instead of per matrix cell.
  release-dry-run:
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for semantic-release to verify npm auth via trusted publishing (OIDC)
      contents: write # for semantic-release to verify Git push access during dry-run

    steps:
      - uses: actions/checkout@v7

      - name: Semantic Release Test
        uses: cycjimmy/semantic-release-action@v8
        with:
          dry_run: true
          branches: |
            [
              'master',
              'main',
              'next',
              'next-major',
              {
                name: 'beta',
                prerelease: true
              },
              {
                name: 'alpha',
                prerelease: true
              }
            ]
          extra_plugins: |
            @semantic-release/git
            @semantic-release/changelog
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_NPM_AUTH: 'true'
